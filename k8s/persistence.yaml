apiVersion: v1
kind: PersistentVolume
metadata:
  name: desafio2-postgres-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data/desafio2-postgres"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: desafio2-postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi